services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: customer_support
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d customer_support"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/customer_support?TimeZone=UTC
      SPRING_DATASOURCE_USERNAME: support_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      WS_ALLOWED_ORIGINS: http://localhost:3000
      DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://server:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
